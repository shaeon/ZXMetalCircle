# Construye una imagen del entorno de compilación (docker/Dockerfile) y la sube
# al registro de paquetes de GitHub (GHCR). La Action «Build» compila dentro de
# ella.
#
# Solo a mano (Actions > Docker > Run workflow), eligiendo el compilador:
#   - 14.2.rel1 → ghcr.io/<dueño>/zxmetalcircle-build:gcc14.2
#   - 15.2.rel1 → ghcr.io/<dueño>/zxmetalcircle-build:gcc15.2
# Con «Etiquetar también como docker/VERSION» lleva además :<VERSION> y
# :latest; esa es la que usan main y dev (build.yml pide :1). Antes se
# construía sola con cada cambio de docker/, y eso volvía a subir la :1 con los
# paquetes de Ubuntu de ese día: ahora la :1 solo cambia cuando se pide.
name: Docker

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Arm GNU Toolchain'
        type: choice
        options: ['14.2.rel1', '15.2.rel1']
        default: '15.2.rel1'
      version_tag:
        description: 'Etiquetar también como docker/VERSION y latest (la de main y dev)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # para subir la imagen a GHCR

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Versión de la imagen
        id: version
        run: |
          v=$(tr -d '[:space:]' < docker/VERSION)
          t="${{ inputs.toolchain }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zxmetalcircle-build"
          tags="$image:gcc${t%.rel*}"
          if [ "${{ inputs.version_tag }}" = "true" ]; then
            tags="$tags"$'\n'"$image:$v"$'\n'"$image:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Compilador $t; etiquetas:"
          echo "$tags"

      - name: Entrar en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v7
        with:
          context: docker
          push: true
          build-args: ARM_TOOLCHAIN=${{ inputs.toolchain }}
          tags: ${{ steps.version.outputs.tags }}
