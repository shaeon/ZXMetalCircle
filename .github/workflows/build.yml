# Compila ZXMetalCircle en GitHub: pruebas en el PC, los siete kernels y la SD.
#
# - En cada push a main, en los pull requests y a mano (Actions > Build > Run
#   workflow): deja la SD en un zip descargable en "Artifacts" del run.
# - Al subir una etiqueta vX.YY (git tag -a v1.02 ...; git push origin v1.02):
#   además crea un BORRADOR de release con ese zip; solo falta pegar las notas
#   y publicarlo.
# - En la rama stdlib (pruebas con circle-stdlib) compila dos veces, con el
#   compilador de siempre (imagen :1, gcc 14.2) y con el 15.2 (imagen
#   :gcc15.2), y deja el tamaño de cada kernel en el resumen del run.
name: Build

on:
  push:
    branches: [main, dev, stdlib]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para crear el borrador de release con las etiquetas
  packages: read    # para bajar la imagen del entorno de GHCR

jobs:
  build:
    runs-on: ubuntu-24.04
    # En stdlib, una compilación por compilador (sin parar las dos si falla una)
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(github.ref_name == 'stdlib' && '["1","gcc15.2"]' || '["1"]') }}
    # Todo el entorno (paquetes y Arm GNU Toolchain) viene en la imagen
    # (docker/Dockerfile, la sube a mano la Action «Docker»): ya no se instala
    # nada en cada ejecución, y no depende de los servidores de Ubuntu ni de
    # los de Arm. La :1 es la de main y dev (gcc 14.2)
    container:
      image: ghcr.io/${{ github.repository_owner }}/zxmetalcircle-build:${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas en el PC
        working-directory: test/host
        run: |
          sed 's#"roms/#"../../roms/#' ../../src/roms.S > roms_host.S
          echo '.section .note.GNU-stack,"",@progbits' >> roms_host.S
          S=../../src; M=../../third_party/mame
          CORE="$S/spectrum.cpp $S/ula.cpp $S/zxmemory.cpp $S/pagers.cpp $S/divmmc.cpp $S/tapedeck.cpp $S/snapshot.cpp $S/ay8912.cpp $S/audiomixer.cpp $S/tape.cpp $S/hostinput.cpp $S/zxkeyboard.cpp \
                $S/interface1.cpp $S/plus3disk.cpp $S/sdcard.cpp $S/spectranet.cpp $S/earinput.cpp \
                $S/zxnet.cpp $M/*.cpp $M/compat/*.cpp $S/inflate.cpp ../../third_party/z80cpp/z80.cpp"
          FLAGS="-O2 -std=c++17 -DWITH_BREAKPOINT_SUPPORT -I. -I$S -I../../third_party/z80cpp -I$M/compat -I$M"
          g++ $FLAGS -o kempston_ports_test kempston_ports_test.cpp $CORE roms_host.S
          ./kempston_ports_test
          g++ $FLAGS -o mouse_sens_test mouse_sens_test.cpp $CORE roms_host.S
          ./mouse_sens_test
          g++ $FLAGS -o palette_test palette_test.cpp $CORE roms_host.S
          ./palette_test
          g++ $FLAGS -o ulaplus_ports_test ulaplus_ports_test.cpp $CORE roms_host.S
          ./ulaplus_ports_test
          g++ $FLAGS -o border_test border_test.cpp $CORE roms_host.S
          ./border_test
          g++ $FLAGS -o snow_test snow_test.cpp $CORE roms_host.S
          ./snow_test
          g++ $FLAGS -o tape_stop_test tape_stop_test.cpp $CORE roms_host.S
          ./tape_stop_test
          g++ $FLAGS -o tape_edit_test tape_edit_test.cpp $CORE roms_host.S
          ./tape_edit_test
          g++ $FLAGS -o tzx_blocks_test tzx_blocks_test.cpp $CORE roms_host.S
          ./tzx_blocks_test
          g++ $FLAGS -o floatbus_test plus3/floatbus_test.cpp $CORE roms_host.S
          ./floatbus_test
          g++ $FLAGS -o multiface_test multiface_test.cpp $CORE roms_host.S
          ./multiface_test
          g++ $FLAGS -o lec_test lec_test.cpp $CORE roms_host.S
          ./lec_test
          g++ $FLAGS -o cartridge_test cartridge_test.cpp $CORE roms_host.S
          ./cartridge_test
          g++ $FLAGS -o cpm_test cpm_test.cpp $CORE roms_host.S
          ./cpm_test
          g++ $FLAGS -o divmmc_test divmmc_test.cpp $CORE roms_host.S
          ./divmmc_test
          g++ $FLAGS -o if1_snet_test if1_snet_test.cpp $CORE roms_host.S
          ./if1_snet_test
          g++ $FLAGS -o tapedeck_test tapedeck_test.cpp $CORE roms_host.S
          ./tapedeck_test
          g++ $FLAGS -o filetypes_test filetypes_test.cpp $S/filetypes.cpp $CORE roms_host.S
          ./filetypes_test
          g++ $FLAGS -o state_test state_test.cpp $CORE roms_host.S
          ./state_test
          g++ $FLAGS -o snapshot_snet_test snapshot_snet_test.cpp $CORE roms_host.S
          ./snapshot_snet_test
          # Pruebas de referencia: la emulación de todos los modelos, igual que
          # en golden/huellas.txt (ver golden_test.cpp)
          g++ $FLAGS -o golden_test golden_test.cpp $CORE roms_host.S
          ./golden_test
          g++ $FLAGS -o z80_q_test z80_q_test.cpp ../../third_party/z80cpp/z80.cpp
          ./z80_q_test
          g++ $FLAGS -o sp_test sp_test.cpp $CORE roms_host.S
          ./sp_test
          g++ $FLAGS -o zx81_test zx81_test.cpp $S/zx81.cpp $CORE roms_host.S
          ./zx81_test
          g++ $FLAGS -o mdr_format_test mdr_format_test.cpp $CORE roms_host.S
          ./mdr_format_test
          g++ -O2 -std=c++17 -I. -I$S -o joystick_test joystick_test.cpp $S/zxkeyboard.cpp
          ./joystick_test
          g++ -O2 -std=c++17 -I. -I$S -o multikbd_test multikbd_test.cpp $S/hostinput.cpp $S/zxkeyboard.cpp
          ./multikbd_test
          g++ -O2 -std=c++17 -I. -I$S -o players_test players_test.cpp $S/zxkeyboard.cpp
          ./players_test
          g++ -O2 -std=c++17 -I. -I$S -o padassign_test padassign_test.cpp $S/padassign.cpp
          ./padassign_test
          g++ -O2 -std=c++17 -I. -I$S -o padsettings_test padsettings_test.cpp $S/settings.cpp t_stub.cpp
          ./padsettings_test
          g++ -O2 -std=c++17 -I. -I$S -o webfiles_test webfiles_test.cpp $S/webfiles.cpp
          ./webfiles_test
          g++ -O2 -std=c++17 -I. -I$S -o padprofile_test padprofile_test.cpp $S/padprofile.cpp
          ./padprofile_test
          g++ -O2 -std=c++17 -I. -I$S -o pok_test pok_test.cpp $S/pokfile.cpp
          ./pok_test
          g++ -O2 -std=c++17 -I. -I$S -o zxinfo_pok_test zxinfo_pok_test.cpp $S/download/zxinfo.cpp $S/inflate.cpp t_stub.cpp
          ./zxinfo_pok_test
          g++ -O2 -std=c++17 -Wall -I. -I$S -o wificonfig_test wificonfig_test.cpp $S/wificonfig.cpp
          ./wificonfig_test
          # reintentos del cliente HTTPS: se compila con Mbed TLS, como en la Pi
          MB=../../third_party/mbedtls; mkdir -p mbedtls_host
          for f in $MB/library/*.c; do
            gcc -O1 -c -I$MB/include -I$MB -DMBEDTLS_CONFIG_FILE='"zxmc_config.h"' $f -o mbedtls_host/$(basename $f .c).o
          done
          gcc -O1 -c download/glue_host.c -o mbedtls_host/glue_host.o
          g++ -O2 -std=c++17 -I. -I$S -I$MB/include -I$MB -DMBEDTLS_CONFIG_FILE='"zxmc_config.h"' \
              -o retry_test download/retry_test.cpp $S/download/httpsclient.cpp t_stub.cpp mbedtls_host/*.o
          ./retry_test
          g++ -O2 -std=c++17 -I. -I$S -o keyboard_hold_test keyboard_hold_test.cpp $S/hostinput.cpp $S/zxkeyboard.cpp
          ./keyboard_hold_test
          g++ -O2 -std=c++17 -I. -I$S -o input_test input_test.cpp $S/hostinput.cpp $S/zxkeyboard.cpp
          ./input_test
          g++ -O2 -std=c++17 -I. -I$S -o models_test models_test.cpp
          ./models_test
          g++ -O2 -std=c++17 -I. -I$S -o gpio_keys_test gpio_keys_test.cpp $S/zxkeyboard.cpp
          ./gpio_keys_test
          g++ -O2 -std=c++17 -I. -I$S -o zip_test zip_test.cpp $S/zipfile.cpp $S/inflate.cpp
          ./zip_test
          g++ -O2 -std=c++17 -I. -I$S -o update_test update_test.cpp $S/updater.cpp $S/zipfile.cpp $S/inflate.cpp
          ./update_test
          g++ -O2 -std=c++17 -I. -I$S -o recreated_test recreated_test.cpp $S/recreated.cpp
          ./recreated_test
          g++ -O2 -std=c++17 -I. -I$S -I$M/compat -I$M -o fdc_test plus3/fdc_test.cpp $M/*.cpp $M/compat/*.cpp
          ./fdc_test
          g++ -O2 -std=c++17 -I. -I$S -I$M/compat -I$M -o prot_test plus3/prot_test.cpp $M/*.cpp $M/compat/*.cpp
          ./prot_test
          g++ -O2 -std=c++17 -I. -I$S -I$M/compat -I$M -o seek_test plus3/seek_test.cpp $M/*.cpp $M/compat/*.cpp
          ./seek_test

      - name: Compilar los kernels y la SD
        run: ./build.sh

      - name: Versión
        id: version
        run: |
          v=$(sed -n 's/.*ZXCIRCLE_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versión $v"
          ls -la sdcard/kernel*.img
          {
            echo "### Imagen ${{ matrix.image }} ($(aarch64-none-elf-gcc -dumpversion))"
            echo '```'
            ls -l sdcard/kernel*.img | awk '{printf "%-22s %9d\n", $9, $5}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Zip de la SD
        run: |
          cd sdcard
          zip -qr -X "../ZXMetalCircle-${{ steps.version.outputs.version }}-sd.zip" .

      # El artefacto, con la carpeta de la tarjeta: GitHub mete los artefactos en
      # un zip al descargarlos, así que subir el zip ya hecho daba un zip dentro
      # de otro. La release sí lleva el zip (abajo).
      - name: Subir la tarjeta (Artifacts)
        uses: actions/upload-artifact@v6
        with:
          name: ZXMetalCircle-${{ steps.version.outputs.version }}-sd${{ matrix.image != '1' && format('-{0}', matrix.image) || '' }}
          path: sdcard/

      - name: Borrador de release (solo con etiquetas vX.YY)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.image == '1'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: ZXMetalCircle ${{ steps.version.outputs.version }}
          files: ZXMetalCircle-${{ steps.version.outputs.version }}-sd.zip
