# Compila ZXMetalCircle en GitHub: pruebas en el PC, los siete kernels y la SD.
#
# - En cada push a main, en los pull requests y a mano (Actions > Build > Run
#   workflow): deja la SD en un zip descargable en "Artifacts" del run.
# - Al subir una etiqueta vX.YY (git tag -a v1.02 ...; git push origin v1.02):
#   además crea un BORRADOR de release con ese zip; solo falta pegar las notas
#   y publicarlo.
name: Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # para crear el borrador de release con las etiquetas
  packages: read    # para bajar la imagen del entorno de GHCR

jobs:
  build:
    runs-on: ubuntu-24.04
    # Todo el entorno (paquetes y Arm GNU Toolchain 14.2) viene en la imagen
    # (docker/Dockerfile, la sube la Action «Docker»): ya no se instala nada en
    # cada ejecución, y no depende de los servidores de Ubuntu ni de los de Arm.
    # Al cambiar el entorno, súbase el número aquí y en docker/VERSION
    container:
      image: ghcr.io/${{ github.repository_owner }}/zxmetalcircle-build:1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas en el PC
        working-directory: test/host
        run: |
          sed 's#"roms/#"../../roms/#' ../../src/roms.S > roms_host.S
          S=../../src; M=../../third_party/mame
          CORE="$S/spectrum.cpp $S/ay8912.cpp $S/audiomixer.cpp $S/tape.cpp $S/zxkeyboard.cpp \
                $S/interface1.cpp $S/plus3disk.cpp $S/sdcard.cpp $S/spectranet.cpp $S/earinput.cpp \
                $S/zxnet.cpp $M/*.cpp $M/compat/*.cpp $S/inflate.cpp ../../third_party/z80cpp/z80.cpp"
          FLAGS="-O2 -std=c++17 -DWITH_BREAKPOINT_SUPPORT -I. -I$S -I../../third_party/z80cpp -I$M/compat -I$M"
          g++ $FLAGS -o kempston_ports_test kempston_ports_test.cpp $CORE roms_host.S
          ./kempston_ports_test
          g++ $FLAGS -o palette_test palette_test.cpp $CORE roms_host.S
          ./palette_test
          g++ $FLAGS -o ulaplus_ports_test ulaplus_ports_test.cpp $CORE roms_host.S
          ./ulaplus_ports_test
          g++ $FLAGS -o border_test border_test.cpp $CORE roms_host.S
          ./border_test
          g++ $FLAGS -o tape_stop_test tape_stop_test.cpp $CORE roms_host.S
          ./tape_stop_test
          g++ $FLAGS -o tzx_blocks_test tzx_blocks_test.cpp $CORE roms_host.S
          ./tzx_blocks_test
          g++ $FLAGS -o floatbus_test plus3/floatbus_test.cpp $CORE roms_host.S
          ./floatbus_test
          g++ $FLAGS -o snapshot_snet_test snapshot_snet_test.cpp $S/snapshot.cpp $CORE roms_host.S
          ./snapshot_snet_test
          g++ $FLAGS -o zx81_test zx81_test.cpp $S/zx81.cpp $CORE roms_host.S
          ./zx81_test
          g++ -O2 -std=c++17 -I. -I$S -o joystick_test joystick_test.cpp $S/zxkeyboard.cpp
          ./joystick_test
          g++ -O2 -std=c++17 -I. -I$S -o players_test players_test.cpp $S/zxkeyboard.cpp
          ./players_test
          g++ -O2 -std=c++17 -I. -I$S -o padassign_test padassign_test.cpp $S/padassign.cpp
          ./padassign_test
          g++ -O2 -std=c++17 -I. -I$S -o padsettings_test padsettings_test.cpp $S/settings.cpp t_stub.cpp
          ./padsettings_test
          g++ -O2 -std=c++17 -I. -I$S -o webfiles_test webfiles_test.cpp $S/webfiles.cpp
          ./webfiles_test
          g++ -O2 -std=c++17 -I. -I$S -o padprofile_test padprofile_test.cpp $S/padprofile.cpp
          ./padprofile_test
          g++ -O2 -std=c++17 -I. -I$S -o keyboard_hold_test keyboard_hold_test.cpp $S/zxkeyboard.cpp
          ./keyboard_hold_test
          g++ -O2 -std=c++17 -I. -I$S -o gpio_keys_test gpio_keys_test.cpp $S/zxkeyboard.cpp
          ./gpio_keys_test
          g++ -O2 -std=c++17 -I. -I$S -o zip_test zip_test.cpp $S/zipfile.cpp $S/inflate.cpp
          ./zip_test
          g++ -O2 -std=c++17 -I. -I$S -o update_test update_test.cpp $S/updater.cpp $S/zipfile.cpp $S/inflate.cpp
          ./update_test
          g++ -O2 -std=c++17 -I. -I$S -o recreated_test recreated_test.cpp $S/recreated.cpp
          ./recreated_test
          g++ -O2 -std=c++17 -I. -I$S -I$M/compat -I$M -o fdc_test plus3/fdc_test.cpp $M/*.cpp $M/compat/*.cpp
          ./fdc_test
          g++ -O2 -std=c++17 -I. -I$S -I$M/compat -I$M -o prot_test plus3/prot_test.cpp $M/*.cpp $M/compat/*.cpp
          ./prot_test

      - name: Compilar los kernels y la SD
        run: ./build.sh

      - name: Versión
        id: version
        run: |
          v=$(sed -n 's/.*ZXCIRCLE_VERSION[[:space:]]*"\(.*\)".*/\1/p' src/version.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Versión $v"
          ls -la sdcard/kernel*.img

      - name: Zip de la SD
        run: |
          cd sdcard
          zip -qr -X "../ZXMetalCircle-${{ steps.version.outputs.version }}-sd.zip" .

      # El artefacto, con la carpeta de la tarjeta: GitHub mete los artefactos en
      # un zip al descargarlos, así que subir el zip ya hecho daba un zip dentro
      # de otro. La release sí lleva el zip (abajo).
      - name: Subir la tarjeta (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ZXMetalCircle-${{ steps.version.outputs.version }}-sd
          path: sdcard/

      - name: Borrador de release (solo con etiquetas vX.YY)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ZXMetalCircle ${{ steps.version.outputs.version }}
          files: ZXMetalCircle-${{ steps.version.outputs.version }}-sd.zip
