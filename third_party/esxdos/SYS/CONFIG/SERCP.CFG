# .sercp configuration file

# communication interface
interface=AY
#interface=EL
#interface=SIF
#interface=NEXT

# communication speed
baudrate=38400
#baudrate=115200

#  https://vym.cz/sercp
# default interface is AY
# AY   -a serial port ZXS 128k
# EL   -e USB eLeMeNtZX / MB03+
# SIF  -s SIF UART 16C650
# NEXT -x ZX Next Wifi port

# -t turbo speed 115200 Bd
# -n normal speed 38400 Bd

